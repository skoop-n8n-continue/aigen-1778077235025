<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
  <!-- skoop-live-runtime -->
  <script src="./skoop-live.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changeable Analog Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container" class="face-classic">
        <div id="bg-effects" class="bg-classic"></div>
        <div class="clock-wrapper">
            <div class="clock" id="clock-element">
                <div class="effects-layer" id="effects-layer"></div>
                <div class="markers" id="markers"></div>
                <div class="hand hour-hand" id="hour-hand"></div>
                <div class="hand minute-hand" id="minute-hand"></div>
                <div class="hand second-hand" id="second-hand"></div>
                <div class="center-dot"></div>
            </div>
        </div>
        <div class="info-panel">
            <h2 id="face-name">Classic Face</h2>
            <p id="cycle-info">Face changing automatically every 15 seconds</p>
        </div>
        <div class="theme-selector">
            <h3>Choose Face:</h3>
            <select id="theme-dropdown" class="theme-dropdown">
                <option value="0">Classic</option>
                <option value="1">Dark</option>
                <option value="2">Minimalist</option>
                <option value="3">Neon</option>
            </select>
        </div>
    </div>
    <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
