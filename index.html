<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
  <!-- skoop-live-runtime -->
  <script src="./skoop-live.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changeable Analog Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container" class="face-classic">
        <div class="clock-wrapper">
            <div class="clock">
                <div class="markers" id="markers"></div>
                <div class="hand hour-hand" id="hour-hand"></div>
                <div class="hand minute-hand" id="minute-hand"></div>
                <div class="hand second-hand" id="second-hand"></div>
                <div class="center-dot"></div>
            </div>
        </div>
        <div class="info-panel">
            <h2 id="face-name">Classic Face</h2>
            <p id="cycle-info">Face changing automatically every 15 seconds</p>
        </div>
        <div class="theme-selector">
            <h3>Choose Face:</h3>
            <div class="theme-buttons">
                <button data-index="0" class="theme-btn active">Classic</button>
                <button data-index="1" class="theme-btn">Dark</button>
                <button data-index="2" class="theme-btn">Minimalist</button>
                <button data-index="3" class="theme-btn">Neon</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
